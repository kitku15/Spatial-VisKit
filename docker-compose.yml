services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MODULE_10_DIR=/data
    volumes:
      # THIS IS THE MAGIC LINE: It reads the folder name from your .env file!
      - ./public/${ACTIVE_DATASET_FOLDER}:/data

  frontend:
    build: .
    ports:
      - "5173:5173"
    depends_on:
      - backend
